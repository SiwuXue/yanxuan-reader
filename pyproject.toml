[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhihu-salt-novel-downloader"
version = "5.0.2"
description = "知乎盐选小说下载器 v5 —— 双击即用的个人备份工具：扫码登录、整本下载、断点续传、EPUB 精排、书架追更"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "xfengyin" }]
keywords = ["zhihu", "salt", "novel", "downloader", "epub", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",          # 不拉 [standard]：避免 uvloop/httptools/watchfiles 等 26 包传递依赖
    "ebooklib>=0.18",
    "fonttools>=4.0",           # 知乎盐选字体反爬解码：读取 cmap / uniXXXX 字形名
    "Pillow>=10.0",             # 字体反爬解码：自定义字体逐字形渲染（OCR 回退）
    "ddddocr",                  # 字体反爬解码：字形名随机化时用 OCR 还原真实汉字
]

[project.optional-dependencies]
browser = ["browser-cookie3>=0.19.0"]  # 可选：浏览器 Cookie 自动导入
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",            # FastAPI TestClient 需要
    "ruff>=0.4.0",
]

[project.scripts]
zhihu-downloader = "zhihu_downloader.cli:main"

[project.urls]
Homepage = "https://github.com/SiwuXue/yanxuan-reader"
Issues = "https://github.com/SiwuXue/yanxuan-reader/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zhihu_downloader"]
# 注意：packages 已含 app/static 全部文件——不要再加 force-include 映射同一目标路径，
# hatchling 会以 "second file at the same path" 直接炸 wheel 构建（v5.0.0 CI 三平台同挂的根因）。

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
